# Continuous Integration Workflow / 持续集成构建与测试工作流
# Builds the Frontend SPA first (embedded via `-tags webui` from web/dist), then vets, tests (-race) and
# cross-compiles the Go gateway. Also checks that a plain `go build ./...` works without web/dist.
# 先构建前端 SPA（通过 `-tags webui` 内嵌 web/dist），再执行 Go 静态检查、竞态测试与交叉编译；
# 同时校验未构建前端时 `go build ./...` 也能通过。
# Actions are pinned by commit SHA (Dependabot keeps them up to date).

name: CI / 持续集成

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build Web & Test Go Gateway / 前后端编译与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository / 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js / 配置 Node.js 环境
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Setup Go / 配置 Go 环境
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fresh-clone build without web/dist / 未构建前端时的编译检查
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Check go.mod tidiness / 校验 go.mod 整洁
        run: go mod tidy -diff

      - name: Lint deploy script / 检查部署脚本
        run: shellcheck deploy/deploy.sh

      - name: Install & Build Web Console / 安装依赖、类型检查并构建前端控制台 (web/dist)
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Go Vet / Go 静态检查
        env:
          CGO_ENABLED: "0"
        run: go vet -tags webui ./...

      - name: Unit Tests (race) / 单元测试（竞态检测）
        env:
          CGO_ENABLED: "1"
        run: go test -race -tags webui ./...

      - name: Build Gateway & Probe Binaries / 编译网关主程序与探测工具
        env:
          CGO_ENABLED: "0"
        run: |
          go build -tags webui -trimpath -ldflags="-s -w" -o ./antigravity-gateway ./cmd/gateway
          go build -trimpath -ldflags="-s -w" -o ./antigravity-probe ./cmd/probe

      - name: Cross-Compile Linux & Windows / 交叉编译 Linux 与 Windows
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -tags webui ./...
          GOOS=linux GOARCH=arm64 go build -tags webui ./...
          GOOS=windows GOARCH=amd64 go build -tags webui ./...
          GOOS=windows GOARCH=arm64 go build -tags webui ./...

  govulncheck:
    name: Go Vulnerability Check / Go 漏洞扫描 (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout repository / 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go / 配置 Go 环境
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  npm-audit:
    name: npm Audit / 前端依赖审计 (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout repository / 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js / 配置 Node.js 环境
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: npm audit
        working-directory: ./web
        run: npm audit --audit-level=high
