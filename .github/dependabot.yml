# Dependabot automated dependency maintenance configuration
# Dependabot 依赖自动检查与升级配置（Go Modules 与前端 npm 依赖）
version: 2
updates:
  # Backend Go modules (/go.mod)
  # 后端 Go 模块依赖每周检查
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Frontend React + Vite + Tailwind packages (/web/package.json)
  # 前端 Web 控制台 npm 依赖每周检查
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(web-deps)"

  # GitHub Actions workflows (/.github/workflows)
  # GitHub Actions 工作流组件版本检查
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
